<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasmota 插头面板</title>
<style>
  :root{
    --bg:#0b0e13; --card:#151a22; --card2:#1b222c; --line:rgba(255,255,255,.08);
    --txt:#e6edf3; --dim:#8b98a8; --dim2:#5d6a7a;
    --on:#f5a524; --onSoft:rgba(245,165,36,.14);
    --off:#3a4453; --ok:#4ade80; --bad:#f87171; --blue:#5aa9f5;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt); min-height:100vh; padding:28px 24px 48px;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:500;letter-spacing:.2px}
  .sub{font-size:12.5px;color:var(--dim);margin-top:5px;font-family:var(--mono)}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);transition:background .3s}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.14)}
  .dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.14)}

  .grid{display:grid;grid-template-columns:300px 1fr;gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}

  .switchCard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:230px}
  .btn{
    width:132px;height:132px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
    background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:background .25s,border-color .25s,box-shadow .25s,transform .1s;
    color:var(--dim);font-family:inherit;
  }
  .btn:hover{border-color:rgba(255,255,255,.2)}
  .btn:active{transform:scale(.97)}
  .btn .ico{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .btn .lbl{font-size:12.5px;letter-spacing:1px}
  .btn.isOn{background:var(--onSoft);border-color:rgba(245,165,36,.45);color:var(--on);box-shadow:0 0 0 8px rgba(245,165,36,.05)}
  .btn[disabled]{opacity:.5;cursor:progress}
  .rowBtns{display:flex;gap:8px}
  .mini{
    padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;transition:.2s;
  }
  .mini:hover{color:var(--txt);border-color:rgba(255,255,255,.22)}
  .mini:disabled{opacity:.45;cursor:progress}

  .readings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:560px){.readings{grid-template-columns:repeat(2,1fr)}}
  .cell{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
  .k{font-size:11.5px;color:var(--dim2);letter-spacing:.3px}
  .v{font-family:var(--mono);font-size:25px;margin-top:7px;letter-spacing:-.5px}
  .u{font-size:12px;color:var(--dim);margin-left:3px;font-family:var(--mono)}

  .chartCard{margin-top:14px}
  .chartHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .chartHead h2{font-size:13.5px;font-weight:500}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim)}
  .legend i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle;border-radius:1px}
  canvas{width:100%;height:150px;display:block}

  .info{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  @media(max-width:700px){.info{grid-template-columns:repeat(2,1fr)}}
  .kv{background:var(--card);padding:13px 16px}
  .kv .k{font-size:11px}
  .kv .val{font-family:var(--mono);font-size:13px;margin-top:5px;color:var(--txt)}
  .note{margin-top:14px;font-size:11.5px;color:var(--dim2);line-height:1.7}
  .note b{color:var(--dim);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>插头面板</h1>
      <div class="sub" id="sub">连接中…</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="dotTxt">连接中</span></div>
  </header>

  <div class="grid">
    <div class="card switchCard">
      <button class="btn" id="bigBtn" aria-label="切换开关">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
        <span class="lbl" id="stateLbl">读取中</span>
      </button>
      <div class="rowBtns">
        <button class="mini" data-cmd="on">开</button>
        <button class="mini" data-cmd="off">关</button>
        <button class="mini" data-cmd="toggle">切换</button>
      </div>
    </div>

    <div class="readings">
      <div class="cell"><div class="k">电压</div><div class="v"><span id="v">--</span><span class="u">V</span></div></div>
      <div class="cell"><div class="k">功率</div><div class="v"><span id="w">--</span><span class="u">W</span></div></div>
      <div class="cell"><div class="k">电流</div><div class="v"><span id="a">--</span><span class="u">A</span></div></div>
      <div class="cell"><div class="k">功率因数</div><div class="v"><span id="pf">--</span></div></div>
      <div class="cell"><div class="k">今日用电</div><div class="v"><span id="today">--</span><span class="u">kWh</span></div></div>
      <div class="cell"><div class="k">累计电量</div><div class="v"><span id="total">--</span><span class="u">kWh</span></div></div>
    </div>
  </div>

  <div class="card chartCard">
    <div class="chartHead">
      <h2>最近 3 分钟</h2>
      <div class="legend">
        <span><i style="background:#5aa9f5"></i>功率 W</span>
        <span><i style="background:#f5a524"></i>电压 V</span>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <div class="info">
    <div class="kv"><div class="k">固件</div><div class="val" id="fw">--</div></div>
    <div class="kv"><div class="k">IP 地址</div><div class="val" id="ip">--</div></div>
    <div class="kv"><div class="k">Wi-Fi 信号</div><div class="val" id="rssi">--</div></div>
    <div class="kv"><div class="k">运行时长</div><div class="val" id="up">--</div></div>
  </div>

  <div class="note">
    数据每 2 秒直接从设备 <b>HTTP API</b> 读取（Status 0），不经云端。<br>
    面板由本机 127.0.0.1 转发：Tasmota 响应不带 CORS 头，浏览器直连会被拦。
  </div>
</div>

<script>
const MAXPTS = 90, INT = 2000;
const hist = { w: [], v: [] };
let busy = false, lastOk = null;

const $ = id => document.getElementById(id);
const fmt = (x, d = 0) => (x === null || x === undefined) ? "--" : Number(x).toFixed(d);

async function load() {
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    const d = await r.json();
    if (!d.online) throw new Error(d.error || "设备无响应");
    render(d);
    setLink(true);
    lastOk = Date.now();
  } catch (e) {
    setLink(false);
    $("sub").textContent = "设备离线：" + e.message;
  }
}

function setLink(ok) {
  const dot = $("dot");
  dot.className = "dot " + (ok ? "on" : "off");
  $("dotTxt").textContent = ok ? "在线" : "离线";
}

function render(d) {
  const on = d.power === "ON";
  const btn = $("bigBtn");
  btn.classList.toggle("isOn", on);
  $("stateLbl").textContent = on ? "已通电" : "已断电";
  $("sub").textContent = `${d.name || "Tasmota"} · ${d.ip} · ${d.ssid}`;
  $("fw").textContent = d.version || "--";
  $("ip").textContent = d.ip || "--";
  $("rssi").textContent = (d.rssi == null ? "--" : d.rssi + " dBm");
  $("up").textContent = (d.uptime || "--").replace("T", " ");

  const e = d.energy;
  if (e) {
    $("v").textContent = fmt(e.voltage, 0);
    $("w").textContent = fmt(e.power, 0);
    $("a").textContent = fmt(e.current, 3);
    $("pf").textContent = fmt(e.factor, 2);
    $("today").textContent = fmt(e.today, 3);
    $("total").textContent = fmt(e.total, 3);
    hist.w.push(Number(e.power) || 0);
    hist.v.push(Number(e.voltage) || 0);
    if (hist.w.length > MAXPTS) { hist.w.shift(); hist.v.shift(); }
    draw();
  } else {
    ["v", "w", "a", "pf", "today", "total"].forEach(id => $(id).textContent = "--");
  }
}

function draw() {
  const c = $("chart"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  g.strokeStyle = "rgba(255,255,255,.06)";
  g.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (h / 4) * i;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  }
  if (hist.w.length < 2) return;

  const line = (arr, color) => {
    const max = Math.max(...arr), min = Math.min(...arr);
    const span = (max - min) || 1;
    g.beginPath();
    arr.forEach((val, i) => {
      const x = (i / (MAXPTS - 1)) * w;
      const y = h - 8 - ((val - min) / span) * (h - 16);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.strokeStyle = color; g.lineWidth = 1.8; g.lineJoin = "round"; g.stroke();
  };
  line(hist.v, "#f5a524");
  line(hist.w, "#5aa9f5");
}

async function setPower(cmd) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".mini").forEach(b => b.disabled = true);
  $("bigBtn").disabled = true;
  try {
    await fetch("api/power?cmd=" + cmd, { cache: "no-store" });
    await load();
  } finally {
    busy = false;
    document.querySelectorAll(".mini").forEach(b => b.disabled = false);
    $("bigBtn").disabled = false;
  }
}

$("bigBtn").addEventListener("click", () => setPower("toggle"));
document.querySelectorAll(".mini").forEach(b => b.addEventListener("click", () => setPower(b.dataset.cmd)));
window.addEventListener("resize", draw);

load();
setInterval(load, INT);
</script>
</body>
</html>
